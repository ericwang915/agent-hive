<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https: file:">
<title>Agent Hive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* Chat window palette (light and dark) */
:root {
  --c-bg: #FAF9F5; --c-head: #F4F2EC; --c-box: #FFF; --c-user: #F1EFE8; --c-line: #E6E3DB; --c-rail: #E0DCD2;
  --c-text: #2B2925; --c-dim: #6F6A62; --c-faint: #A5A098; --c-code: #F4F2EC;
  --c-ok: #3FA35B; --c-wait: #E59A3C; --c-err: #D9534A; --c-accent: #D97757; --c-relay: #EFE9FB; --c-relay-ink: #6B56A8;
  --c-add: #E3F5E7; --c-add-ink: #1E6B3A; --c-del: #FCE8E6; --c-del-ink: #A3332A;
}
@media (prefers-color-scheme: dark) {
  :root {
    --c-bg: #1E1D1B; --c-head: #262523; --c-box: #2A2927; --c-user: #302F2C; --c-line: #3A3835; --c-rail: #3F3D39;
    --c-text: #E9E6E0; --c-dim: #A39E95; --c-faint: #75716A; --c-code: #2A2927;
    --c-ok: #56B870; --c-wait: #E8A654; --c-err: #E36D64; --c-accent: #E58B6B; --c-relay: #332D45; --c-relay-ink: #BBA9EC;
    --c-add: #1F3526; --c-add-ink: #8AD69E; --c-del: #40211F; --c-del-ink: #F09A92;
  }
}
body { background: var(--c-bg); color: var(--c-text); display: flex; flex-direction: column; height: 100vh }
#head { height: 46px; flex: none; display: flex; align-items: center; gap: 9px; padding: 0 12px 0 84px; background: var(--c-head); border-bottom: 1px solid var(--c-line); -webkit-app-region: drag }
#head button, #head .tabs { -webkit-app-region: no-drag }
#h-name { font-size: 14.5px }
#h-task { color: var(--c-dim); font-size: 12.5px }
.tabs { display: flex; gap: 2px; margin-left: 10px; background: color-mix(in srgb, var(--c-line) 60%, transparent); padding: 3px; border-radius: 9px }
.tabs button { border: 0; background: transparent; height: 24px; padding: 0 11px; border-radius: 7px; font-size: 12.5px; color: var(--c-dim) }
.tabs button.on { background: var(--c-box); color: var(--c-text); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08) }
.tabs .n { font-variant-numeric: tabular-nums; opacity: .7 }
#h-btns { display: flex; gap: 2px }
.pane { flex: 1; overflow-y: auto; min-height: 0 }

/* Timeline */
#tl { max-width: 880px; margin: 0 auto; padding: 22px 22px 26px 26px; position: relative }
#tl::before { content: ''; position: absolute; left: 34.5px; top: 26px; bottom: 26px; width: 1px; background: var(--c-rail) }
.step { position: relative; padding: 5px 0 5px 30px; font-size: 13.5px }
.step > .dot { position: absolute; left: 5px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--c-ok); box-shadow: 0 0 0 3px var(--c-bg) }
.step.wait > .dot { background: var(--c-wait); animation: hive-blink 1.1s ease-in-out infinite }
.step.err > .dot { background: var(--c-err) }
.step > .mark { position: absolute; left: 0; top: 6px; background: var(--c-bg); border-radius: 50%; padding: 1px 0 }
.step.user { padding: 14px 0 8px 30px }
.step.user:first-child { padding-top: 0 }
.u-meta { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-size: 11.5px; color: var(--c-faint); margin-bottom: 4px }
.u-tag { background: var(--c-relay); color: var(--c-relay-ink); border-radius: 999px; padding: 1px 9px; font-weight: 600; margin-right: auto }
.u-box { background: var(--c-user); border: 1px solid var(--c-line); border-radius: 12px; padding: 9px 13px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; cursor: text; line-height: 1.6 }
.u-box.clip { max-height: 132px; overflow: hidden; cursor: pointer; -webkit-mask-image: linear-gradient(#000 60%, transparent) }
.step.a .md { font-size: 14px }
.gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px }
.gallery img { width: 120px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid var(--c-line); cursor: zoom-in; background: var(--c-code) }
.t-head { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--c-dim); user-select: text }
.t-head b { color: var(--c-text); font-weight: 600 }
.io { margin-top: 5px; border: 1px solid var(--c-line); border-radius: 9px; background: var(--c-box); font: 12px/1.55 var(--mono); overflow: hidden }
.io > div { display: flex; gap: 10px; padding: 5px 10px }
.io > div + div { border-top: 1px solid var(--c-line) }
.io .k { color: var(--c-faint); flex: none; width: 24px; font-size: 10.5px; padding-top: 1.5px; letter-spacing: .04em }
.io .v { flex: 1; min-width: 0; user-select: text; cursor: text; color: var(--c-dim) }
.io .in .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--c-text) }
.io .out .v { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 84px; overflow: hidden }
.io .out.long .v { cursor: pointer; -webkit-mask-image: linear-gradient(#000 55%, transparent) }
.io .out.open .v { max-height: none; -webkit-mask-image: none; cursor: text }
.step.err .e-text { color: var(--c-err); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text }
.sys { padding: 3px 0 3px 30px; font-size: 12px; color: var(--c-faint); position: relative }
.logblk { margin: 4px 0 4px 30px; padding: 6px 10px; background: var(--c-code); border-radius: 8px; font: 11px/1.5 var(--mono); color: var(--c-faint); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 110px; overflow-y: auto; user-select: text }
.runline { margin: 8px 0 6px 30px; padding-top: 8px; border-top: 1px dashed var(--c-line); font-size: 11.5px; color: var(--c-faint); display: flex; gap: 8px }
.runline time { margin-left: auto }
#working { max-width: 880px; margin: -22px auto 22px; padding: 0 22px 0 56px; position: relative; color: var(--c-dim); font-size: 13px; animation: hive-blink 1.4s ease-in-out infinite }
#working .dot { position: absolute; left: 31px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--c-wait) }
#empty { text-align: center; color: var(--c-faint); padding: 70px 20px }
#empty .bee { margin: 0 auto 12px }

/* Changes */
#changes { max-width: 980px; margin: 0 auto; padding: 16px 22px 30px }
.cbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px }
.cbar .br { display: flex; align-items: center; gap: 6px; font-weight: 600; min-width: 0 }
.cbar .br span { font-weight: 400; color: var(--c-dim); font-size: 12.5px }
.commit { display: flex; gap: 8px; margin-bottom: 14px }
.commit input { flex: 1; min-width: 0 }
.note { color: var(--c-dim); padding: 40px 10px; text-align: center }
details.file { border: 1px solid var(--c-line); border-radius: 10px; background: var(--c-box); margin-bottom: 10px; overflow: hidden }
details.file summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; font: 12.5px var(--mono) }
details.file summary::-webkit-details-marker { display: none }
details.file summary::before { content: '▸'; color: var(--c-faint); width: 10px }
details.file[open] summary::before { content: '▾' }
details.file[open] summary { border-bottom: 1px solid var(--c-line) }
.file .add { color: var(--c-add-ink) } .file .del { color: var(--c-del-ink) }
.diff { font: 12px/1.5 var(--mono); overflow-x: auto; user-select: text; cursor: text }
.diff div { white-space: pre; padding: 0 12px; min-width: max-content }
.diff .p { background: var(--c-add); color: var(--c-add-ink) }
.diff .m { background: var(--c-del); color: var(--c-del-ink) }
.diff .h { color: var(--c-faint); background: var(--c-code); padding-top: 2px; padding-bottom: 2px }

/* Footer */
#foot { flex: none; padding: 0 22px 10px; position: relative }
#foot > * { max-width: 836px; margin-left: auto; margin-right: auto }
.approval { border: 1.5px solid var(--c-wait); background: var(--c-box); border-radius: 10px; padding: 11px 13px; margin-bottom: 9px; box-shadow: 0 4px 18px rgba(229, 154, 60, .14) }
.approval .ttl { font-weight: 600; margin-bottom: 6px }
.approval .ttl span { font-weight: 400; color: var(--c-dim) }
.approval pre { margin: 0 0 9px; font: 12px/1.5 var(--mono); background: var(--c-code); border-radius: 8px; padding: 7px 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 150px; overflow-y: auto; user-select: text }
.approval .acts { display: flex; gap: 7px; flex-wrap: wrap }
#composer { background: var(--c-box); border: 1px solid var(--c-line); border-radius: 12px; padding: 9px 10px 7px; transition: border-color .12s }
#composer:focus-within { border-color: color-mix(in srgb, var(--c-accent) 55%, var(--c-line)) }
#composer.drop { border: 1.5px dashed var(--c-accent); background: color-mix(in srgb, var(--c-accent) 7%, var(--c-box)) }
#atts { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px }
#atts:empty { display: none }
.att { display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 4px 0 9px; border-radius: 999px; background: var(--c-user); border: 1px solid var(--c-line); font-size: 11.5px; max-width: 240px }
.att button { border: 0; background: transparent; padding: 0 3px; color: var(--c-faint); line-height: 1; font-size: 14px }
#input { border: 0; background: transparent; color: var(--c-text); width: 100%; resize: none; outline: none !important; padding: 2px 4px; min-height: 24px; max-height: 240px; font-size: 14px; line-height: 1.55; display: block }
.cbtns { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 12px; color: var(--c-dim) }
.cbtns .tool { border: 0; background: transparent; height: 26px; min-width: 26px; padding: 0 7px; border-radius: 8px; color: var(--c-dim); display: inline-flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap }
.cbtns .tool:hover:not(:disabled) { background: var(--c-user); color: var(--c-text) }
.cbtns .tool:disabled { cursor: default }
#relay-toggle.on { background: var(--c-relay); color: var(--c-relay-ink); font-weight: 600 }
#timer { font-variant-numeric: tabular-nums; color: var(--c-faint) }
#send { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--c-accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none }
#send:disabled { opacity: .35; cursor: default }
#send.stop { background: var(--c-text); color: var(--c-bg) }
#hint { font-size: 11.5px; color: var(--c-faint); padding: 6px 6px 0; min-height: 22px; line-height: 1.4 }
.menu { position: absolute; bottom: calc(100% - 4px); background: var(--c-box); border: 1px solid var(--c-line); border-radius: 12px; box-shadow: 0 10px 34px rgba(0, 0, 0, .18); padding: 5px; z-index: 10; min-width: 250px; max-width: 420px !important; margin: 0 !important }
.menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; text-align: left; height: 30px; padding: 0 9px; border-radius: 8px; font-size: 13px; color: var(--c-text) }
.menu .mi.on, .menu .mi:hover { background: var(--c-user) }
.menu .mi code { font: 12.5px var(--mono); color: var(--c-accent); min-width: 62px }
.menu .mi span { color: var(--c-dim); font-size: 12px }
.menu .mi .ck { margin-left: auto; color: var(--c-ok) }
.menu input { width: 100%; margin-top: 4px }
#slash { left: 22px }
</style>
</head>
<body>
<header id="head">
  <span id="h-bee"></span><b id="h-name" class="round ell"></b><span id="h-task" class="ell"></span>
  <div class="tabs"><button data-tab="chat" class="on" title="⌘1">Chat</button><button data-tab="changes" title="⌘2">Changes <span class="n" id="h-n"></span></button></div>
  <span class="grow"></span><span id="h-pill"></span><div id="h-btns"></div>
</header>
<div class="pane" id="pane-chat"><div id="tl"></div></div>
<div class="pane" id="pane-changes" hidden><div id="changes"></div></div>
<footer id="foot">
  <div id="approvals"></div>
  <div class="menu" id="slash" hidden></div>
  <div class="menu" id="model-menu" hidden></div>
  <div id="composer">
    <div id="atts"></div>
    <textarea id="input" rows="1" placeholder="Say something… (/ for commands)" spellcheck="false"></textarea>
    <div class="cbtns">
      <button class="tool" id="attach" title="Attach file">+</button>
      <button class="tool" id="relay-toggle" hidden></button>
      <span id="timer"></span>
      <button class="tool" id="model-pill"></button>
      <span class="grow"></span>
      <span id="perm"></span>
      <button id="send" title="Send">&nbsp;</button>
    </div>
  </div>
  <div id="hint"></div>
</footer>
<script src="node_modules/marked/marked.min.js"></script>
<script src="node_modules/dompurify/dist/purify.min.js"></script>
<script src="team.js"></script>
<script src="common.js"></script>
<script src="chat.js"></script>
</body>
</html>
